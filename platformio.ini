; TerraVid — Firmware de nodo de telemetria IoT (HU-18/HU-19/HU-21)
; https://docs.platformio.org/page/projectconf.html
;
; Dos placas soportadas. Elegir el entorno al compilar y grabar:
;   pio run -e esp32dev   -t upload      (ESP32)
;   pio run -e nodemcuv2  -t upload      (ESP8266, NodeMCU v1.0 / ESP-12E)
; Sin -e se compilan las dos.

[env]
framework = arduino
monitor_speed = 115200
lib_deps =
	adafruit/DHT sensor library@^1.4.6
	adafruit/Adafruit Unified Sensor@^1.1.14
	bblanchon/ArduinoJson@^7.1.0
	; MQTT: solo se usa cuando MQTT_BROKER_URL esta definido en include/config.h.
	knolleary/PubSubClient@^2.8

[env:esp32dev]
platform = espressif32
board = esp32dev
build_flags =
	-D CORE_DEBUG_LEVEL=3

[env:nodemcuv2]
platform = espressif8266
board = nodemcuv2
upload_speed = 460800
monitor_filters = esp8266_exception_decoder
build_flags =
	; PubSubClient trae un buffer de 256 bytes por defecto; alcanza para el
	; payload, se deja explicito para que no dependa de la version.
	-D MQTT_MAX_PACKET_SIZE=512
